name: Build & Deploy
on:
  push: 
    branches: 
      -  main
  pull_request: 
    types: 
      -  opened
      -  synchronize
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Build Step
        run: echo "Building the application, e.g npm build for Node.js"
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - name: Deploy Step
        run: echo "Deploy the app using the right command"
