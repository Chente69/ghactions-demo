name: Nice if example
on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
jobs:
  quality_checks:
    if: github.event_name == 'push' && ( startsWith(github.ref_name, 'feature')) 
    runs-on: ubuntu-latest
    steps:
      - name: Perform code quality
        run: |
          echo "Performing quality checks on the code..."
  dev_deploy:
    if: github.event_name == 'push' && github.ref_name == 'develop' 
    runs-on: ubuntu-latest
    steps:
      - name: Dev Deploy
        run: |
          echo "Deploying the code to development environment..."
  prod_deploy:
    if: github.event_name == 'push' && github.ref_name == 'main' 
    runs-on: ubuntu-latest
    steps:
      - name: Prod Deploy
        run: |
          echo "Deploying the code to production environment..."
  success_notify:
    needs: [quality_checks, dev_deploy, prod_deploy]
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Success
        run: |
          echo "Success email sentto the team!"                   
  failure_notify:
    needs: [quality_checks, dev_deploy, prod_deploy]
    if:  failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Failure
        run: |
          echo "Failure email sentto the team!"   